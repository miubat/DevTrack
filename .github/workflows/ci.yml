# CI for every pull request (SRS NFR-OPS-01)
# AGL-07.1: lint and unit tests. AGL-07.2: API tests against PostgreSQL.
# AGL-33.1: Playwright end-to-end tests.
# A failing job blocks merge once it is marked "required" in branch protection (AGL-07.3).
# Keep the job ids (backend, api-tests, frontend, e2e) stable: branch protection uses them.

name: CI

on:
  pull_request: # every pull request, any target branch
  push:
    branches: [master, main] # keeps the README badge up to date

# Cancel an older run when new commits are pushed to the same PR
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  # AGL-07.2: API tests against a real PostgreSQL 16 (same image as db/docker-compose.yml)
  api-tests:
    name: api-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack
          TZ: UTC
        ports:
          - 5432:5432
        # Wait until the database accepts connections
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            backend/package-lock.json

      # 1) Build the real schema and test data (owner user)
      - name: Install db tools
        working-directory: db
        run: npm ci

      - name: Migrate
        working-directory: db
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack?schema=public

      - name: Seed
        working-directory: db
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack?schema=public

      # 2) Run the API tests as the app user (no UPDATE/DELETE on activities)
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: API tests (e2e)
        working-directory: backend
        run: npm run test:e2e
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://devtrack_app:devtrack_app@localhost:5432/devtrack?schema=public
          # The app will not start without this. Test-only value, not a real secret.
          JWT_ACCESS_SECRET: ci-test-only-secret-not-used-anywhere-else

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      # Includes the TypeScript type check (tsc -b)
      - name: Build
        run: npm run build

  # AGL-33.1: Playwright tests. Playwright starts the frontend dev server itself
  # (TARGET=local, see e2e/playwright.config.ts).
  # AGL-33.3: this job also starts PostgreSQL and the backend, so the login smoke
  # test signs in for real on every pull request.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devtrack
          POSTGRES_PASSWORD: devtrack
          POSTGRES_DB: devtrack
          TZ: UTC
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U devtrack -d devtrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: e2e
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            db/package-lock.json
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json

      # 1) Real schema and test data (owner user), same as the api-tests job
      - name: Install db tools
        working-directory: db
        run: npm ci

      - name: Migrate
        working-directory: db
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack?schema=public

      - name: Seed
        working-directory: db
        run: npm run db:seed
        env:
          DATABASE_URL: postgresql://devtrack:devtrack@localhost:5432/devtrack?schema=public

      # 2) Start the backend as the app user and wait until it answers
      - name: Install backend
        working-directory: backend
        run: npm ci

      - name: Build backend
        working-directory: backend
        run: npm run build

      - name: Start backend
        working-directory: backend
        run: |
          nohup node dist/main > "$GITHUB_WORKSPACE/backend.log" 2>&1 &
        env:
          NODE_ENV: test
          PORT: 3000
          DATABASE_URL: postgresql://devtrack_app:devtrack_app@localhost:5432/devtrack?schema=public
          # Test-only value, not a real secret.
          JWT_ACCESS_SECRET: ci-test-only-secret-not-used-anywhere-else

      - name: Wait for backend
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/ > /dev/null; then
              echo "backend is up"
              exit 0
            fi
            sleep 2
          done
          echo "backend did not start"
          cat "$GITHUB_WORKSPACE/backend.log"
          exit 1

      # 3) Playwright
      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # E2E_BACKEND=true: the tests that sign in run here too (see login-navigation.spec.ts)
      - name: Playwright tests
        run: npm test
        env:
          TARGET: local
          E2E_BACKEND: 'true'

      - name: Backend log (on failure)
        if: failure()
        run: cat "$GITHUB_WORKSPACE/backend.log"

      # Keep the HTML report (screenshots and traces of failures) for 14 days
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
